<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Springy Wobblebot</title><desc id="d">A plastic enclosure rests on four compression spring legs and has a 3 volt motor with offset collar on top.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#176b87"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:22px;font-weight:bold}.s{font-size:16px}.body{fill:#94b49f;stroke:#17324d;stroke-width:5}.motor{fill:#6d8c9f;stroke:#17324d;stroke-width:4}.spring{fill:none;stroke:#e85d3f;stroke-width:5}.foot{fill:#17324d}.wave{stroke:#25a8d9;stroke-width:4;fill:none;stroke-dasharray:8 6}</style></defs><rect width="960" height="520" fill="#f7fbfd"/><text x="40" y="42" class="h">Springy Wobblebot — imbalance, vibration, and friction</text><rect x="345" y="220" width="260" height="130" rx="16" class="body"/><rect x="410" y="160" width="130" height="50" rx="8" class="motor"/><line x1="540" y1="185" x2="590" y2="185" stroke="#17324d" stroke-width="8"/><circle cx="605" cy="170" r="23" fill="#f2b134" stroke="#17324d" stroke-width="4"/><circle cx="615" cy="170" r="7" fill="#e85d3f"/><text x="625" y="155" class="s">offset collar</text><path d="M390 350 l-12 12 l24 12 l-24 12 l24 12 l-12 12 M555 350 l-12 12 l24 12 l-24 12 l24 12 l-12 12 M440 350 l-12 12 l24 12 l-24 12 l24 12 l-12 12 M505 350 l-12 12 l24 12 l-24 12 l24 12 l-12 12" class="spring"/><ellipse cx="390" cy="415" rx="24" ry="8" class="foot"/><ellipse cx="440" cy="415" rx="24" ry="8" class="foot"/><ellipse cx="505" cy="415" rx="24" ry="8" class="foot"/><ellipse cx="555" cy="415" rx="24" ry="8" class="foot"/><path d="M290 290 C240 250 240 350 290 315 M655 290 C705 250 705 350 655 315" class="wave" marker-end="url(#a)"/><text x="350" y="455" class="s">change spring stiffness, foot material, or eccentric offset</text><text x="360" y="120" class="s">3 V battery only</text></svg>
