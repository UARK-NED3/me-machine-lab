<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three-power Galilean monocular optical schematic</title>
  <desc id="desc">A 150 millimeter positive objective and a minus 50 millimeter eyepiece are separated by approximately 100 millimeters. Parallel rays enter and leave parallel, producing an upright three-power view.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#006c8f"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#172b3a}.label{font:600 17px Arial,sans-serif;fill:#172b3a}.body{font:15px Arial,sans-serif;fill:#405665}.small{font:13px Arial,sans-serif;fill:#405665}.axis{stroke:#8298a6;stroke-width:2;stroke-dasharray:8 7}.ray{fill:none;stroke:#006c8f;stroke-width:3;marker-end:url(#arrow)}.lens{fill:#bfe9f5;fill-opacity:.7;stroke:#007ba8;stroke-width:4}.tube{fill:#28333a;stroke:#121a20;stroke-width:3}.dim{stroke:#d07222;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}.note{fill:#fff6e8;stroke:#d07222;stroke-width:2}.warning{fill:#fff0ef;stroke:#bf3030;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8fbfc"/>
  <text x="60" y="55" class="title">Build-a-Monocular Lab — 3× Galilean optical layout</text>
  <text x="60" y="83" class="body">Illustrative paraxial ray diagram; not a tolerance-controlled optical prescription.</text>
  <line x1="90" y1="324" x2="1080" y2="324" class="axis"/>
  <rect x="320" y="270" width="185" height="108" rx="20" class="tube"/>
  <rect x="660" y="292" width="135" height="64" rx="18" class="tube"/>
  <path d="M355 205 Q325 324 355 443 Q385 324 355 205Z" class="lens"/>
  <path d="M735 265 Q757 324 735 383 Q713 324 735 265Z" class="lens"/>
  <text x="248" y="180" class="label">Objective</text>
  <text x="230" y="205" class="body">Thorlabs AC254-150-A-ML</text>
  <text x="266" y="228" class="body">fₒ = +150 mm</text>
  <text x="680" y="430" class="label">Eyepiece</text>
  <text x="655" y="454" class="body">Thorlabs LC1715-A</text>
  <text x="671" y="477" class="body">fₑ = −50 mm</text>
  <path d="M95 230 L355 280 L735 309 L1070 319" class="ray"/>
  <path d="M95 418 L355 368 L735 339 L1070 329" class="ray"/>
  <path d="M95 276 L355 302 L735 317 L1070 322" class="ray"/>
  <path d="M95 372 L355 346 L735 331 L1070 326" class="ray"/>
  <line x1="370" y1="520" x2="724" y2="520" class="dim"/>
  <line x1="370" y1="494" x2="370" y2="540" stroke="#d07222" stroke-width="2"/>
  <line x1="724" y1="494" x2="724" y2="540" stroke="#d07222" stroke-width="2"/>
  <text x="474" y="552" class="label">nominal lens separation ≈ 100 mm</text>
  <rect x="850" y="118" width="280" height="125" rx="12" class="note"/>
  <text x="873" y="151" class="label">Derived, infinity focus</text>
  <text x="873" y="178" class="body">Angular magnification: M ≈ −fₒ/fₑ = +3</text>
  <text x="873" y="203" class="body">Lens separation: L ≈ fₒ + fₑ = 100 mm</text>
  <text x="873" y="228" class="body">Positive M denotes an upright image.</text>
  <rect x="850" y="390" width="280" height="112" rx="12" class="warning"/>
  <text x="873" y="423" class="label" fill="#9f1717">Never aim at the Sun.</text>
  <text x="873" y="450" class="body">No solar viewing, lasers, or bright</text>
  <text x="873" y="473" class="body">reflections. A front solar filter would</text>
  <text x="873" y="496" class="body">require a separately approved design.</text>
</svg>
