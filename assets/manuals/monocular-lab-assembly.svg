<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Graphical assembly manual for Build-a-Monocular Lab</title>
  <desc id="desc">Four panels show the mounted objective, three threaded tubes, mounted negative eyepiece, and focusing plus safe viewing check.</desc>
  <defs><style>.h{font:700 25px Arial,sans-serif;fill:#172b3a}.n{font:700 20px Arial,sans-serif;fill:#fff}.t{font:700 16px Arial,sans-serif;fill:#172b3a}.s{font:14px Arial,sans-serif;fill:#405665}.p{fill:#fff;stroke:#c8d7df;stroke-width:2}.tube{fill:#273239;stroke:#111b20;stroke-width:2}.glass{fill:#c2edf5;stroke:#007ba8;stroke-width:3}.arrow{stroke:#007ba8;stroke-width:4;marker-end:url(#a)}.bad{fill:#fff0ef;stroke:#bf3030;stroke-width:2}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#007ba8"/></marker></defs>
  <rect width="1200" height="430" fill="#f8fbfc"/><text x="42" y="46" class="h">Build-a-Monocular Lab — graphical assembly and use sequence</text>
  <g transform="translate(36 78)"><rect width="260" height="305" rx="14" class="p"/><circle cx="30" cy="30" r="19" fill="#007ba8"/><text x="24" y="37" class="n">1</text><text x="60" y="35" class="t">Install objective</text><rect x="44" y="112" width="170" height="54" rx="20" class="tube"/><ellipse cx="55" cy="139" rx="16" ry="42" class="glass"/><text x="26" y="213" class="s">Thread the mounted +150 mm</text><text x="26" y="235" class="s">objective into the front tube.</text><text x="26" y="267" class="s">Use only supplied threads.</text></g>
  <path d="M306 230H338" class="arrow"/>
  <g transform="translate(350 78)"><rect width="260" height="305" rx="14" class="p"/><circle cx="30" cy="30" r="19" fill="#007ba8"/><text x="24" y="37" class="n">2</text><text x="60" y="35" class="t">Build tube stack</text><rect x="34" y="112" width="62" height="54" rx="14" class="tube"/><rect x="94" y="112" width="78" height="54" rx="14" class="tube"/><rect x="168" y="118" width="27" height="42" rx="10" class="tube"/><text x="26" y="213" class="s">SM1L10 + SM1L20 + SM1V05</text><text x="26" y="235" class="s">approach the 100 mm optical target.</text><text x="26" y="267" class="s">Do not force threads.</text></g>
  <path d="M620 230H652" class="arrow"/>
  <g transform="translate(664 78)"><rect width="260" height="305" rx="14" class="p"/><circle cx="30" cy="30" r="19" fill="#007ba8"/><text x="24" y="37" class="n">3</text><text x="60" y="35" class="t">Install eyepiece</text><rect x="47" y="112" width="160" height="54" rx="20" class="tube"/><path d="M194 95Q215 139 194 183Q173 139 194 95Z" class="glass"/><text x="26" y="213" class="s">Retain the −50 mm eyepiece</text><text x="26" y="235" class="s">in the adjustable rear tube.</text><text x="26" y="267" class="s">Keep both optic surfaces clean.</text></g>
  <path d="M934 230H966" class="arrow"/>
  <g transform="translate(978 78)"><rect width="186" height="305" rx="14" class="bad"/><circle cx="30" cy="30" r="19" fill="#bf3030"/><text x="24" y="37" class="n">4</text><text x="60" y="35" class="t">Focus safely</text><path d="M40 130H146" class="arrow"/><circle cx="95" cy="132" r="30" fill="#ffe685" stroke="#d58a00" stroke-width="2"/><line x1="50" y1="90" x2="140" y2="178" stroke="#bf3030" stroke-width="9"/><text x="21" y="213" class="s">Aim at a distant building</text><text x="21" y="235" class="s">or sign, then turn the</text><text x="21" y="257" class="s">focus ring. Never Sun,</text><text x="21" y="279" class="s">lasers, or reflections.</text></g>
</svg>
