<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Catalog-parts toy graphical assembly method</title>
  <desc id="desc">Four illustrated panels show how students make a bolt-together frame, add a purchased moving module, add safe play features, and inspect the mechanism without cutting or machining.</desc>
  <style>
    .bg{fill:#f7fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.rail{fill:#94a3b8;stroke:#334155;stroke-width:4}.slot{stroke:#f8fafc;stroke-width:5}.fastener{fill:#f59e0b;stroke:#92400e;stroke-width:3}.part{fill:#38bdf8;stroke:#075985;stroke-width:4}.accent{fill:#f97316;stroke:#9a3412;stroke-width:4}.move{fill:#86efac;stroke:#166534;stroke-width:4}.note{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}.step{fill:#0f172a}.num{fill:#fff;font:700 30px Arial}.h{fill:#0f172a;font:700 30px Arial}.t{fill:#334155;font:22px Arial}.small{fill:#475569;font:18px Arial}.arrow{stroke:#334155;stroke-width:7;fill:none;marker-end:url(#arrow)}.ban{stroke:#dc2626;stroke-width:9}.ok{stroke:#16a34a;stroke-width:9;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12Z" fill="#334155"/></marker></defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="70" y="72" class="h" style="font-size:42px">Graphical manual: build with catalog parts only</text>
  <text x="70" y="108" class="t">All holes, slots, bores, and lengths are supplied as purchased. Tighten with hand tools; do not cut, drill, machine, or shape parts.</text>

  <rect class="panel" x="60" y="150" width="350" height="610" rx="18"/><circle class="step" cx="105" cy="196" r="30"/><text class="num" x="96" y="207">1</text>
  <text class="h" x="155" y="207">Make a frame</text><text class="small" x="95" y="242">Use fixed-length rails and factory slots.</text>
  <rect class="rail" x="110" y="330" width="230" height="36" rx="4"/><line class="slot" x1="130" y1="348" x2="320" y2="348"/><rect class="rail" x="110" y="520" width="230" height="36" rx="4"/><line class="slot" x1="130" y1="538" x2="320" y2="538"/>
  <rect class="rail" x="110" y="366" width="36" height="154" rx="4"/><line class="slot" x1="128" y1="385" x2="128" y2="500"/><rect class="rail" x="304" y="366" width="36" height="154" rx="4"/><line class="slot" x1="322" y1="385" x2="322" y2="500"/>
  <circle class="fastener" cx="128" cy="348" r="13"/><circle class="fastener" cx="322" cy="348" r="13"/><circle class="fastener" cx="128" cy="538" r="13"/><circle class="fastener" cx="322" cy="538" r="13"/>
  <path class="ok" d="M106 646 l22 22 l43 -52"/><text class="t" x="175" y="667">factory features only</text>
  <circle cx="325" cy="651" r="32" fill="#fee2e2"/><path class="ban" d="M303 629 L347 673 M347 629 L303 673"/><text class="small" x="110" y="718">No cutting a rail to fit.</text>

  <rect class="panel" x="430" y="150" width="350" height="610" rx="18"/><circle class="step" cx="475" cy="196" r="30"/><text class="num" x="466" y="207">2</text>
  <text class="h" x="525" y="207">Add motion</text><text class="small" x="465" y="242">Choose an exact purchased module.</text>
  <rect class="rail" x="480" y="560" width="245" height="32" rx="4"/><line class="slot" x1="500" y1="576" x2="705" y2="576"/>
  <rect class="part" x="530" y="455" width="48" height="100" rx="8"/><rect class="part" x="626" y="455" width="48" height="100" rx="8"/>
  <circle class="accent" cx="554" cy="403" r="66"/><circle class="accent" cx="650" cy="403" r="84"/><circle fill="#fff" stroke="#9a3412" stroke-width="4" cx="554" cy="403" r="10"/><circle fill="#fff" stroke="#9a3412" stroke-width="4" cx="650" cy="403" r="10"/>
  <path class="arrow" d="M575 332 C602 299 635 299 658 330"/><text class="small" x="486" y="640">Example: set-screw-bore gears.</text><text class="small" x="486" y="671">Check the bore, shaft, and mesh before play.</text>

  <rect class="panel" x="800" y="150" width="350" height="610" rx="18"/><circle class="step" cx="845" cy="196" r="30"/><text class="num" x="836" y="207">3</text>
  <text class="h" x="895" y="207">Make it playful</text><text class="small" x="835" y="242">Add a pre-made functional feature.</text>
  <rect class="rail" x="850" y="575" width="245" height="32" rx="4"/><line class="slot" x1="870" y1="591" x2="1075" y2="591"/>
  <rect class="note" x="890" y="480" width="165" height="90" rx="12"/><circle class="move" cx="925" cy="525" r="20"/><path class="arrow" d="M953 525 L1020 525"/><text class="small" x="907" y="554">ball / car / rotor</text>
  <rect class="part" x="865" y="350" width="45" height="132" rx="6"/><line class="slot" x1="887" y1="365" x2="887" y2="468"/><path class="arrow" d="M920 394 C958 360 1004 360 1040 392"/><rect class="move" x="1032" y="365" width="34" height="58" rx="14"/>
  <text class="small" x="846" y="659">Use only contained, low-energy motion.</text><text class="small" x="846" y="690">Install catcher/guard before testing.</text>

  <rect class="panel" x="1170" y="150" width="370" height="610" rx="18"/><circle class="step" cx="1215" cy="196" r="30"/><text class="num" x="1206" y="207">4</text>
  <text class="h" x="1265" y="207">Inspect and iterate</text><text class="small" x="1205" y="242">One change, then one repeatable test.</text>
  <rect class="note" x="1220" y="330" width="270" height="210" rx="16"/><text class="t" x="1250" y="380">Before play</text><path class="ok" d="M1250 414 l14 14 l30 -36"/><text class="small" x="1300" y="428">fasteners snug</text><path class="ok" d="M1250 462 l14 14 l30 -36"/><text class="small" x="1300" y="476">moving part clears</text><path class="ok" d="M1250 510 l14 14 l30 -36"/><text class="small" x="1300" y="524">projectile/weight contained</text>
  <path class="arrow" d="M1240 610 L1450 610"/><text class="small" x="1210" y="670">Measure → adjust one variable → explain.</text><text class="small" x="1210" y="706">Stop if a part slips, bends, or escapes.</text>
  <text class="small" x="70" y="838">Visual is a general assembly method, not a part-specific drawing. Use only after a project passes the exact-BOM release gate.</text>
</svg>
