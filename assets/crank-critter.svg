<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Crank Critter dual-cam assembly path</title>
  <desc id="desc">A graphical manual showing a VEX hand crank, 12 tooth to 36 tooth gear reduction, two phase-offset cams, and two guided followers.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#176b87"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:20px;font-weight:bold}.s{font-size:15px}.p{fill:#c9d3d9;stroke:#17324d;stroke-width:3}.b{fill:#e7ecef;stroke:#17324d;stroke-width:3}.g{fill:#202a33;stroke:#17324d;stroke-width:3}.d{stroke:#176b87;stroke-width:3;fill:none;marker-end:url(#a)}.m{stroke:#e85d3f;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="960" height="520" fill="#f7fbfd"/><text x="34" y="38" class="t">Crank Critter — stationary dual-cam automaton</text><text x="34" y="62" class="s">A hand crank drives a 12T/36T VEX gear pair; two stock cams give phase-offset follower motion.</text>
  <rect x="68" y="125" width="770" height="300" rx="8" fill="#fff" stroke="#17324d" stroke-width="3"/><rect x="91" y="145" width="58" height="240" class="p"/><rect x="752" y="145" width="58" height="240" class="p"/><rect x="108" y="385" width="685" height="26" class="b"/>
  <path d="M91 260H36M55 260V220M55 260V300" fill="none" stroke="#202a33" stroke-width="12"/><text x="30" y="195" class="s">hand crank</text>
  <circle cx="194" cy="260" r="34" class="g"/><circle cx="315" cy="260" r="82" class="g"/><circle cx="194" cy="260" r="8" fill="#e7ecef"/><circle cx="315" cy="260" r="9" fill="#e7ecef"/><text x="151" y="365" class="s">12T</text><text x="282" y="365" class="s">36T</text><path d="M165 202A58 58 0 0 1 225 205" class="m"/><text x="120" y="105" class="t">1. 3:1 reduction</text>
  <line x1="397" y1="260" x2="652" y2="260" stroke="#6d8c9f" stroke-width="14"/><ellipse cx="474" cy="260" rx="33" ry="61" class="g"/><ellipse cx="585" cy="260" rx="61" ry="33" class="g"/><text x="428" y="355" class="s">cam A</text><text x="555" y="355" class="s">cam B, 90° offset</text>
  <rect x="452" y="120" width="32" height="96" class="b"/><rect x="563" y="120" width="32" height="96" class="b"/><rect x="438" y="102" width="60" height="18" rx="4" fill="#e85d3f"/><rect x="549" y="102" width="60" height="18" rx="4" fill="#e85d3f"/><path d="M468 100V75M579 100V75" class="d"/><text x="418" y="94" class="s">follower A</text><text x="558" y="94" class="s">follower B</text>
  <path d="M690 125V214" class="m"/><path d="M720 214V125" class="m"/><text x="655" y="108" class="t">2. Guide followers</text><text x="650" y="457" class="s">Use only the four 1x25 bars: 2 base, 2 guides.</text><text x="42" y="495" class="s">Turn ten cycles at hand speed. Confirm gear mesh, follower capture, and a stable frame before student use.</text>
</svg>
