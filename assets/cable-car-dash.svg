<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Cable-Car Dash counterweighted toy</title><desc id="d">Two bolted towers support pulleys, a cable car, drive cord, and enclosed counterweight.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#176b87"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:22px;font-weight:bold}.s{font-size:16px}.rail{stroke:#6d8c9f;stroke-width:14}.line{stroke:#17324d;stroke-width:4;fill:none}.cord{stroke:#e85d3f;stroke-width:4;fill:none}.car{fill:#f2b134;stroke:#17324d;stroke-width:4}.cw{fill:#94b49f;stroke:#17324d;stroke-width:4}</style></defs><rect width="960" height="520" fill="#f7fbfd"/><text x="40" y="42" class="h">Cable-Car Dash — counterweight and pulley control</text><line x1="200" y1="410" x2="760" y2="410" class="rail"/><line x1="230" y1="410" x2="230" y2="125" class="rail"/><line x1="730" y1="410" x2="730" y2="125" class="rail"/><circle cx="230" cy="125" r="28" fill="#f2b134" stroke="#17324d" stroke-width="4"/><circle cx="730" cy="125" r="28" fill="#f2b134" stroke="#17324d" stroke-width="4"/><path d="M230 125 L730 125" class="line"/><rect x="430" y="102" width="110" height="65" rx="10" class="car"/><circle cx="452" cy="172" r="10" fill="#17324d"/><circle cx="518" cy="172" r="10" fill="#17324d"/><text x="442" y="140" class="s">cargo car</text><path d="M700 125 L700 320" class="cord"/><rect x="670" y="320" width="60" height="60" rx="6" class="cw"/><text x="645" y="405" class="s">≤250 g enclosed</text><path d="M280 90 L420 90" stroke="#176b87" stroke-width="4" marker-end="url(#a)"/><text x="300" y="75" class="s">travel direction</text><text x="155" y="450" class="s">bolt-together tower</text><text x="665" y="450" class="s">station flag</text></svg>
