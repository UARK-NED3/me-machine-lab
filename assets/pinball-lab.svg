<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Pinball Lab layout</title><desc id="d">A reconfigurable pinball table with boundary rails, ball launcher, bumpers, flippers, and scoring zones.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:22px;font-weight:bold}.s{font-size:16px}.board{fill:#d9e9ed;stroke:#17324d;stroke-width:6}.rail{fill:#6d8c9f;stroke:#17324d;stroke-width:3}.bumper{fill:#f2b134;stroke:#17324d;stroke-width:4}.spring{fill:none;stroke:#e85d3f;stroke-width:4}.flip{stroke:#176b87;stroke-width:13;stroke-linecap:round}.ball{fill:#e85d3f;stroke:#17324d;stroke-width:3}</style></defs><rect width="960" height="520" fill="#f7fbfd"/><text x="40" y="42" class="h">Pinball Lab — reconfigurable game from catalog parts</text><rect x="170" y="80" width="560" height="360" rx="10" class="board"/><path d="M170 80H730V440H170Z" class="rail" fill="none" stroke-width="18"/><circle cx="420" cy="155" r="25" class="bumper"/><circle cx="580" cy="185" r="25" class="bumper"/><circle cx="330" cy="260" r="25" class="bumper"/><circle cx="490" cy="285" r="25" class="bumper"/><circle cx="625" cy="315" r="25" class="bumper"/><text x="290" y="130" class="s">move bumpers to change paths</text><path d="M230 385 l15 -12 l-15 -12 l15 -12 l-15 -12 l15 -12" class="spring"/><line x1="210" y1="385" x2="280" y2="385" stroke="#17324d" stroke-width="8"/><text x="185" y="420" class="s">launcher</text><line x1="330" y1="390" x2="430" y2="355" class="flip"/><line x1="570" y1="390" x2="470" y2="355" class="flip"/><circle cx="330" cy="390" r="7" class="ball"/><circle cx="570" cy="390" r="7" class="ball"/><text x="396" y="425" class="s">spring-return flippers</text><circle cx="260" cy="340" r="12" class="ball"/><path d="M260 325 C240 240 270 190 385 165" fill="none" stroke="#25a8d9" stroke-width="4" stroke-dasharray="8 6"/><text x="740" y="165" class="s">score zones</text><text x="740" y="195" class="s">• bumpers</text><text x="740" y="222" class="s">• kickers</text><text x="740" y="249" class="s">• stations</text></svg>
