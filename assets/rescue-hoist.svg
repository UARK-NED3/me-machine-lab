<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Rescue Hoist 9 to 1 gear train assembly path</title>
  <desc id="desc">A graphical manual showing a VEX hand crank, two 12 tooth to 36 tooth stages, ratcheted winch, stock rope, hanging 100 gram test weight, and sidewall barrier.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#176b87"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:20px;font-weight:bold}.s{font-size:15px}.p{fill:#c9d3d9;stroke:#17324d;stroke-width:3}.g{fill:#202a33;stroke:#17324d;stroke-width:3}.shaft{stroke:#6d8c9f;stroke-width:14}.rope{fill:none;stroke:#e85d3f;stroke-width:4}.d{stroke:#176b87;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="960" height="520" fill="#f7fbfd"/><text x="34" y="38" class="t">Rescue Hoist — stock 9:1 hand-cranked gear winch</text><text x="34" y="62" class="s">Two 12T→36T stages (3:1 × 3:1) drive a VEX ratcheted drum; test only with the listed 100 g hanging weight.</text>
  <rect x="70" y="110" width="745" height="300" rx="8" fill="#fff" stroke="#176b87" stroke-width="5" stroke-dasharray="9 7"/><text x="82" y="135" class="s">side plates + external 1x25 access barrier; verify physical finger clearance</text>
  <rect x="106" y="152" width="45" height="225" class="p"/><rect x="734" y="152" width="45" height="225" class="p"/><line x1="145" y1="255" x2="720" y2="255" class="shaft"/>
  <path d="M138 255H72M92 255V215M92 255V295" fill="none" stroke="#202a33" stroke-width="12"/><text x="48" y="195" class="s">hand crank</text>
  <circle cx="202" cy="255" r="30" class="g"/><circle cx="330" cy="255" r="77" class="g"/><circle cx="440" cy="255" r="30" class="g"/><circle cx="568" cy="255" r="77" class="g"/><circle cx="202" cy="255" r="7" fill="#e7ecef"/><circle cx="330" cy="255" r="9" fill="#e7ecef"/><circle cx="440" cy="255" r="7" fill="#e7ecef"/><circle cx="568" cy="255" r="9" fill="#e7ecef"/>
  <text x="176" y="365" class="s">12T</text><text x="300" y="365" class="s">36T</text><text x="414" y="365" class="s">12T</text><text x="538" y="365" class="s">36T</text><path d="M232 170H299" class="d"/><text x="232" y="160" class="s">stage 1: 3:1</text><path d="M470 170H537" class="d"/><text x="470" y="160" class="s">stage 2: 3:1</text>
  <line x1="330" y1="205" x2="440" y2="205" stroke="#17324d" stroke-width="10"/><text x="330" y="195" class="s">compound shaft</text><rect x="643" y="210" width="66" height="90" rx="16" fill="#6d8c9f" stroke="#17324d" stroke-width="4"/><text x="630" y="325" class="s">ratcheted drum</text>
  <path d="M676 300C676 350 694 360 694 400" class="rope"/><path d="M681 300C681 350 699 360 699 400" class="rope"/><rect x="674" y="400" width="44" height="55" rx="18" fill="#aeb9c0" stroke="#17324d" stroke-width="3"/><path d="M696 400v-15q0-12 10-12" fill="none" stroke="#17324d" stroke-width="4"/><text x="726" y="444" class="s">1914T65, 100 g</text>
  <text x="42" y="495" class="s">Commission unloaded first; then lift 100 g over a padded landing zone with a spotter. Stop on gear climb, rope pile-up, ratchet slip, or plate flex.</text>
</svg>
