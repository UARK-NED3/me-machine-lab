<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">HydroGrab stock-parts assembly path</title>
  <desc id="desc">A graphical manual showing three water-filled syringe circuits actuating an arm made from two VEX plates and four uncut VEX bars.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#176b87"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:20px;font-weight:bold}.s{font-size:15px}.p{fill:#c9d3d9;stroke:#17324d;stroke-width:3}.b{fill:#e7ecef;stroke:#17324d;stroke-width:3}.n{fill:#202a33}.q{fill:#fff;stroke:#17324d;stroke-width:3}.w{fill:none;stroke:#25a8d9;stroke-width:5}.d{stroke:#176b87;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="960" height="520" fill="#f7fbfd"/><text x="34" y="38" class="t">HydroGrab — stock-parts hydraulic arm</text><text x="34" y="62" class="s">Use factory holes, supplied #8-32 fasteners, uncut 1x25 bars, uncut 39 in Luer lines, and hand-tight Luer connections only.</text>
  <text x="45" y="110" class="t">1. Build the VEX frame</text><rect x="66" y="145" width="42" height="220" class="p"/><rect x="190" y="145" width="42" height="220" class="p"/><rect x="42" y="365" width="218" height="28" class="b"/><rect x="42" y="405" width="218" height="28" class="b"/><circle cx="128" cy="220" r="9" class="n"/><circle cx="128" cy="300" r="9" class="n"/><text x="56" y="458" class="s">2 plates + 2 base rails</text>
  <text x="353" y="110" class="t">2. Add two links and claw</text><rect x="374" y="287" width="180" height="25" rx="4" class="b" transform="rotate(-32 374 287)"/><rect x="535" y="196" width="145" height="25" rx="4" class="b" transform="rotate(42 535 196)"/><circle cx="391" cy="273" r="10" class="n"/><circle cx="541" cy="178" r="10" class="n"/><path d="M658 291q34-24 54 0M658 291q34 24 54 0" fill="none" stroke="#202a33" stroke-width="10"/><text x="385" y="355" class="s">2 remaining 1x25 bars</text><text x="595" y="335" class="s">276-6010 claw</text>
  <text x="700" y="110" class="t">3. Connect 3 circuits</text><g transform="translate(710 140)"><rect x="0" y="10" width="87" height="28" rx="6" class="q"/><line x1="22" y1="10" x2="22" y2="38" stroke="#17324d" stroke-width="3"/><rect x="0" y="75" width="87" height="28" rx="6" class="q"/><line x1="22" y1="75" x2="22" y2="103" stroke="#17324d" stroke-width="3"/><rect x="0" y="140" width="87" height="28" rx="6" class="q"/><line x1="22" y1="140" x2="22" y2="168" stroke="#17324d" stroke-width="3"/><path d="M87 24C145 24 145 55 181 55" class="w"/><path d="M87 89C145 89 145 115 181 115" class="w"/><path d="M87 154C145 154 145 176 181 176" class="w"/><rect x="181" y="39" width="48" height="28" rx="6" class="q"/><rect x="181" y="101" width="48" height="28" rx="6" class="q"/><rect x="181" y="162" width="48" height="28" rx="6" class="q"/></g><text x="710" y="356" class="s">Master → 39 in line → slave</text><text x="710" y="380" class="s">Purge air; add coupler only if needed.</text>
  <path d="M277 265H337" class="d"/><path d="M687 265H745" class="d"/><text x="42" y="495" class="s">Commission unloaded: verify no leaks, kinks, binding, or plunger side-load before a lightweight-object trial.</text>
</svg>
