<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Gear Garden kinetic sculpture</title><desc id="d">A hand wheel drives three differently sized external spur gears on a bolt-together frame.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#176b87"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:22px;font-weight:bold}.s{font-size:16px}.frame{stroke:#6d8c9f;stroke-width:16;fill:none}.gear{fill:#f2b134;stroke:#17324d;stroke-width:5}.hub{fill:#e85d3f;stroke:#17324d;stroke-width:3}.tag{stroke:#25a8d9;stroke-width:9;stroke-linecap:round}</style></defs><rect width="960" height="520" fill="#f7fbfd"/><text x="40" y="42" class="h">Gear Garden — playful motion from compatible spur gears</text><rect x="160" y="100" width="590" height="300" class="frame"/><circle cx="275" cy="260" r="55" class="gear"/><circle cx="405" cy="260" r="82" class="gear"/><circle cx="560" cy="260" r="48" class="gear"/><circle cx="275" cy="260" r="9" class="hub"/><circle cx="405" cy="260" r="9" class="hub"/><circle cx="560" cy="260" r="9" class="hub"/><path d="M275 205 L275 150 M235 225 L195 190 M315 225 L355 190" class="tag"/><path d="M405 178 L405 115 M345 205 L300 160 M465 205 L510 160" class="tag"/><path d="M560 212 L560 165 M530 225 L495 200 M590 225 L625 200" class="tag"/><circle cx="210" cy="325" r="42" fill="none" stroke="#17324d" stroke-width="9"/><line x1="210" y1="325" x2="275" y2="300" stroke="#17324d" stroke-width="9"/><text x="150" y="385" class="s">handwheel</text><path d="M300 120 A50 50 0 0 1 345 160" fill="none" stroke="#176b87" stroke-width="4" marker-end="url(#a)"/><path d="M390 145 A65 65 0 0 0 470 180" fill="none" stroke="#176b87" stroke-width="4" marker-end="url(#a)"/><text x="650" y="180" class="s">same module +</text><text x="650" y="207" class="s">pressure angle</text><text x="650" y="234" class="s">for every mesh</text><text x="300" y="450" class="s">Use gear size and phase to make the pattern intentional.</text></svg>
